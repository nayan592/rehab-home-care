<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(90deg, #ffffff 0%, #c9d6ff 100%);
      min-height: 100vh;
      padding: 40px 0;
    }
    .profile-container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      max-width: 900px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .profile-info {
      margin-bottom: 10px;
    }
    .logout-btn {
      margin-top: 20px;
    }
    .edit-btn {
      font-size: 0.9rem;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <div class="profile-container">
    <h2>User Profile</h2>
    <div id="profileDetails">
      <p class="profile-info"><strong>Name:</strong> <span id="userName"></span></p>
      <p class="profile-info"><strong>Email:</strong> <span id="userEmail"></span></p>
      <p class="profile-info"><strong>Phone:</strong> <span id="userPhone"></span></p>
      <button class="btn btn-sm btn-primary edit-btn" onclick="editProfile()">Edit Profile</button>

      <div id="editProfileForm" style="display:none;" class="mt-3">
        <input id="editName" class="form-control mb-2" placeholder="Edit Name">
        <input id="editPhone" class="form-control mb-2" placeholder="Edit Phone">
        <button class="btn btn-success btn-sm" onclick="saveProfile()">Save</button>
        <button class="btn btn-secondary btn-sm" onclick="cancelEditProfile()">Cancel</button>
      </div>

      <div id="appointmentsSection">
        <h4 class="mt-4">My Appointments</h4>
        <p class="text-muted small">Appointments you created (from this account).</p>
        <div id="appointmentsList" class="mt-2">
          <p class="text-muted mb-0">Loading…</p>
        </div>
      </div>
    </div>

    <button class="btn btn-danger btn-block logout-btn" onclick="logout()">Logout</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>
  <script src="src/js/firebase.js"></script>
</body>
</html>
